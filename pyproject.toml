[project]
name = "myquizautomation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zavesh14", email = "zavesh14@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.17.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
myquizautomation = "myquizautomation:main"

[build-system]
